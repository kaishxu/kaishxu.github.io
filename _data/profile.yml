short_bio_text_justify: false
short_bio: >-
  <p>
    I am a last-year PhD student in <a href="https://polyunlp.github.io/" target="_blank">PolyU NLP Group</a> at <a href="https://www.polyu.edu.hk/" target="_blank">The Hong Kong Polytechnic University</a>, fortunately advised by Prof. <a href="https://www4.comp.polyu.edu.hk/~cswjli/" target="_blank">Maggie, Wenjie Li</a>. Before that, I received my MSc and BMgt degrees from <a href="https://english.hust.edu.cn/" target="_blank">Huazhong University of Science and Technology</a>.
  </p>
  <p>
    I am working on <strong>Medical AI</strong> and <strong>Agentic Reasoning</strong>. Especially, I focus on the following directions:
  </p>
  <ul>
    <li><strong>Medical AI</strong>: Focusing on clinician-like medical dialogue systems with structured clinical communication, comprehensive differential diagnosis, and prototypical clinical reasoning (DFMed@ACL'23 and Emulation@ACL'24 Findings), together with retrieval-augmented medical reasoning (RAR<sup>2</sup>@EMNLP'25 Findings).</li>
    <li><strong>Agentic Reasoning</strong>: Focusing on reliable and efficient reasoning for LLM agents, including subtle-error-aware preference learning (RISE@ACL'25), robust multi-faceted evaluation (ARJudge@ACL'25 Findings), and test-time scaling (LIMOPro@NeurIPS'25), as well as GUI grounding for computer-use agents (PreView@arXiv).</li>
  </ul>
  <p>
    🎙️🎙️ An invited talk I gave at <a href="https://stanford-medai.github.io/" target="_blank">Stanford MedAI</a> is available on <a href="https://www.youtube.com/watch?v=T4if1iDbxaE" target="_blank">Youtube</a>.
  </p>
  <p>
    🔥🔥 Feel free to reach out if you are interested in working together or just want to chat!
  </p>

