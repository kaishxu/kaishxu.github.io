short_bio: >-
  <p>
    📧 xu.kaishuai (at) gmail.com<br>
    📧 kaishuaii.xu (at) connect.polyu.hk
  </p>
  <p>
    I received my Ph.D. from <a href="https://www.polyu.edu.hk/" target="_blank">The Hong Kong Polytechnic University</a>, where I was a member of the <a href="https://polyunlp.github.io/" target="_blank">PolyU NLP Group</a>, advised by Prof. <a href="https://www4.comp.polyu.edu.hk/~cswjli/" target="_blank">Maggie, Wenjie Li</a>. Before that, I received my MSc and BMgt degrees from <a href="https://english.hust.edu.cn/" target="_blank">Huazhong University of Science and Technology</a>.
  </p>
  <p>
    I am working on <strong>LLM applications</strong>. Especially, I focus on the following directions:
  </p>
  <ul>
    <li><strong>Medical AI</strong>: Focusing on clinician-like medical dialogue systems (<a href="https://aclanthology.org/2023.findings-acl.423/" target="_blank">DFMed@ACL'23 Findings</a>, <a href="https://aclanthology.org/2024.findings-acl.406/" target="_blank">Emulation@ACL'24 Findings</a>, and <a href="https://aclanthology.org/2025.findings-emnlp.1110/" target="_blank">RAR<sup>2</sup>@EMNLP'25 Findings</a>).</li>
    <li><strong>Agentic Reasoning</strong>: Focusing on reliable and efficient reasoning for LLM agents (<a href="https://aclanthology.org/2025.acl-long.1506/" target="_blank">RISE@ACL'25</a>, <a href="https://aclanthology.org/2025.findings-acl.494/" target="_blank">ARJudge@ACL'25 Findings</a>, <a href="https://arxiv.org/abs/2505.19187" target="_blank">LIMOPro@NeurIPS'25</a>, and <a href="https://arxiv.org/abs/2610.33645" target="_blank">PreView@arXiv</a>).</li>
  </ul>
  <p>
    🔥🔥 Feel free to reach out if you are interested in working together or just want to chat!
  </p>

